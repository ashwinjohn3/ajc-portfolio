# Astro site deploy to GitHub Pages
#
# SCOPE (PRE-MERGE, current state): workflow_dispatch ONLY.
# There is intentionally NO `push:` trigger. Pushing redesign/personal-brand
# MUST NOT be able to deploy and overwrite the live GitHub Pages site, which is
# still owned by nextjs.yml on `main`. This workflow only runs when manually
# dispatched from the Actions tab, so the branch is deploy-inert until merge.
#
# As of U13 cutover prep, the Astro app now lives at the REPO ROOT (it was moved
# out of astro-src/). The `withastro/action` discovers the project at root by
# default, so there is no `path:` override below.
#
# ============================================================================
# MERGE-DAY FLIPS (apply ALL of these in the merge PR, or immediately after):
# ============================================================================
#   1. ADD the push trigger so main auto-deploys. Replace the `on:` block with:
#
#          on:
#            push:
#              branches: ["main"]
#            workflow_dispatch:
#
#   2. DELETE .github/workflows/nextjs.yml (it still owns main's deploy until
#      merge). Keeping both active on main would cause two concurrent deploys
#      racing for the same `github-pages` environment — the concurrency groups
#      differ ("pages" vs "pages-astro"), so GitHub will NOT auto-cancel one.
#
#          git rm .github/workflows/nextjs.yml
#
#   3. (Optional) Rename the concurrency group below from "pages-astro" to
#      "pages" for convention, once nextjs.yml is gone.
#
#   NOTE: the `path: astro-src` override is ALREADY removed (Astro is at root
#   now), so no path change is needed at merge.
#
# See .omc/handoffs/u12-workflow.md and .omc/handoffs/u13-cutover.md for full
# cutover documentation.
# ============================================================================
name: Deploy Astro site to Pages

on:
  # PRE-MERGE: manual dispatch only. NO push trigger — see MERGE-DAY FLIPS above.
  workflow_dispatch:

# Required permissions for GitHub Pages OIDC deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Use a distinct concurrency group from nextjs.yml ("pages") to avoid
# canceling in-flight Next.js deploys while both workflows coexist.
# At cutover (after nextjs.yml is deleted), this can be renamed to "pages".
concurrency:
  group: "pages-astro"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and upload artifact
        uses: withastro/action@v3
        with:
          # Astro app lives at the repo root (moved out of astro-src/ at U13).
          # No `path:` override needed — the action discovers the project at root.
          node-version: 20
        env:
          # Feature flags — projects and photography are hidden by default.
          # Flip to 'true' in a future unit when those pages are ready.
          PUBLIC_SHOW_PROJECTS: 'false'
          PUBLIC_SHOW_PHOTOGRAPHY: 'false'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
