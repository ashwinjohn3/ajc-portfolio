<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ajc monogram">
  <!-- Game Boy DMG olive LCD panel -->
  <rect width="64" height="64" rx="13" fill="#9bbc0f"/>
  <!-- inner bezel hint for an LCD-screen feel -->
  <rect x="5" y="5" width="54" height="54" rx="9" fill="none" stroke="#0f380f" stroke-opacity="0.16" stroke-width="2.4"/>
  <!-- "ajc" lowercase monogram, solid dark-olive ink, bold geometric strokes for 16px legibility -->
  <g fill="none" stroke="#0f380f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- a -->
    <path d="M19.4 31a5.8 5.8 0 1 0 5.8 5.8V31"/>
    <path d="M25.2 31v11.6"/>
    <!-- j (with descender hook) -->
    <path d="M33 31v9.4a4.6 4.6 0 0 1-4.6 4.6"/>
    <!-- c -->
    <path d="M48.6 32.4a6 6 0 1 0 0 8.8"/>
  </g>
  <!-- j tittle (dot) -->
  <circle cx="33" cy="23.2" r="3.1" fill="#0f380f"/>
</svg>
